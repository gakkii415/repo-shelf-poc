name: Validate and publish articles
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repo-shelf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate, test and build
        run: npm run check
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Content report
        if: always()
        run: |
          mkdir -p reports
          report_status=0
          node scripts/validate-content.mjs content/articles --json > reports/content.json || report_status=$?
          cat reports/content.json >> "$GITHUB_STEP_SUMMARY"
          exit "$report_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-report
          path: reports/
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
